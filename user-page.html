<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Granted — User</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">




<!-- Classic images/favicon -->
 
<link rel="icon" href="/images/favicon.ico" sizes="any">

<!-- PNG images/favicons -->
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png?v=2">
<link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48x48.png?v=2">

<!-- Apple -->
<!-- Apple Touch Icons -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png?v=2">
<link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon-167x167.png?v=2">
<link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png?v=2">


<link rel="stylesheet"
      href="/components/css/user-page.css">


</head>

<body>

<div class="success-container">

    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

        <div class="badge">
            ACCESS GRANTED
        </div>

        <h1>
            Welcome,<br>
            User.
        </h1>

        <p class="description">
            Authentication was successful. You now have access
            to your personal user area.
        </p>

        <div class="user-box">
            Signed in as:
            <span>user</span>
        </div>

        <div class="buttons">

            <button
                id="logoutButton"
                class="logout-button">
                Log Out
            </button>

            <a
                href="/"
                class="home-button">
                Home
            </a>

        </div>

    </div>

</div>

<script>
    // Protect the user page
    if (localStorage.getItem("loggedIn") !== "true") {
        window.location.href = "login.html";
    }

    // Logout
    document
        .getElementById("logoutButton")
        .addEventListener("click", function () {
            localStorage.removeItem("loggedIn");
            window.location.href = "login.html";
        });
</script>

</body>
</html>
