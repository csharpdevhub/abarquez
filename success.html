<!DOCTYPE html> 
<html lang="en"> 
    <head> 
        <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
         <title>Access Granted — Israel Abarquez</title> 

         <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
          <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"> 
          
            <link rel="stylesheet" href="/components/css/success.css">

        </head> 
          <body> 
            
            <div class="success-container">

    <div class="success-card">

    <div class="success-icon">
        ✓
    </div>

    <div class="badge">
        ACCESS GRANTED
    </div>

    <h1>
        Welcome, <br>
        
        Employer.
    </h1>

    <p class="description">
        Authentication was successful. You now have access
        to the protected employer area.
    </p>

    <div class="user-box">
        Signed in as:
        <span>employer</span>
    </div>

    <div class="buttons">

        <button
            id="logoutButton"
            class="logout-button">

            Log Out

        </button>

        <a
            href="/"
            class="home-button">

            Home

        </a>

    </div>

</div>

</div> 
<script> 
if (localStorage.getItem("loggedIn") !== "true") { window.location.href = "login.html"; } document .getElementById("logoutButton") .addEventListener("click", function() { localStorage.removeItem("loggedIn"); window.location.href = "login.html"; }); 

</script> 
</body> 
</html>
